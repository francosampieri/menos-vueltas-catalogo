name: Actualizar Catálogo

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:           # también permite correrlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Descargar CSVs y generar JSON
        run: |
          python3 - <<'EOF'
          import urllib.request, csv, json, io

          URL_PRODUCTOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj27LolH-UVxxXUBSF2JWHe1E6ZaIESYYa0QLrICgveXHh3ZXXrZBSX7X8DzLMFtws8wF1N-a-qVil/pub?gid=1666631008&single=true&output=csv"
          URL_GRUPOS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj27LolH-UVxxXUBSF2JWHe1E6ZaIESYYa0QLrICgveXHh3ZXXrZBSX7X8DzLMFtws8wF1N-a-qVil/pub?gid=2138230487&single=true&output=csv"
          URL_PRECIOS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj27LolH-UVxxXUBSF2JWHe1E6ZaIESYYa0QLrICgveXHh3ZXXrZBSX7X8DzLMFtws8wF1N-a-qVil/pub?gid=1017933483&single=true&output=csv"

          def leer_texto(url):
              with urllib.request.urlopen(url) as r:
                  return r.read().decode('utf-8')

          # La primera columna de las hojas es el Id, pero su encabezado a
          # veces viene con otro nombre (por ejemplo "f"). Si no se normaliza,
          # el cruce productos ↔ precios falla y la web queda sin precios.
          ALIAS_ID = ("Id", "f", "ID", "id")

          def normalizar_id(fila):
              if fila.get("Id"):
                  return fila
              for alias in ALIAS_ID:
                  if fila.get(alias):
                      fila["Id"] = fila[alias]
                      break
              return fila

          def leer_csv(url):
              content = leer_texto(url)
              reader = csv.DictReader(io.StringIO(content))
              return [normalizar_id(row) for row in reader]

          def leer_precios(url):
              """
              La hoja Precios tiene DOS tablas lado a lado en el mismo CSV,
              separadas por una columna vacía. No se puede usar DictReader
              directo porque los encabezados se repiten en ambas mitades.

              El corte se detecta buscando la columna separadora (encabezado
              vacío) en vez de asumir posiciones fijas. Antes estaba
              hardcodeado 0-11 / 13-24: al agregar una columna a la tabla B2C
              se corrían todos los índices y los precios mayoristas salían
              mal EN SILENCIO, sin que fallara el build. Así se pueden sumar,
              sacar o reordenar columnas en cualquiera de las dos tablas.
              """
              content = leer_texto(url)
              filas = list(csv.reader(io.StringIO(content)))
              header = filas[0]

              # Primera columna con encabezado vacío = separador entre tablas.
              sep = next((i for i, c in enumerate(header) if not c.strip()), None)
              if sep is None:
                  raise SystemExit(
                      "ERROR: no se encontró la columna separadora en la hoja Precios. "
                      "Tiene que haber UNA columna vacía entre la tabla B2C y la B2B."
                  )

              cols_b2c = header[:sep]
              # Se recorta en el primer encabezado vacío que aparezca después
              # del separador, por si el CSV trae columnas de relleno al final.
              resto = header[sep + 1:]
              fin_b2b = next((i for i, c in enumerate(resto) if not c.strip()), len(resto))
              cols_b2b = resto[:fin_b2b]

              ini_b2b = sep + 1
              print(f"Precios: B2C {len(cols_b2c)} cols {cols_b2c[:3]}... | "
                    f"separador en {sep} | B2B {len(cols_b2b)} cols")

              precios_b2c, precios_b2b = [], []
              for fila in filas[1:]:
                  # Se completa la fila si el CSV la recortó por celdas vacías
                  # al final, así zip() no descarta columnas.
                  fila = fila + [''] * (len(header) - len(fila))
                  izq = fila[:sep]
                  der = fila[ini_b2b:ini_b2b + len(cols_b2b)]
                  if izq and izq[0].strip():
                      precios_b2c.append(normalizar_id(dict(zip(cols_b2c, izq))))
                  if der and der[0].strip():
                      precios_b2b.append(normalizar_id(dict(zip(cols_b2b, der))))
              return precios_b2c, precios_b2b

          productos = leer_csv(URL_PRODUCTOS)
          grupos    = leer_csv(URL_GRUPOS)
          precios_b2c, precios_b2b = leer_precios(URL_PRECIOS)

          resultado = {
              "productos": productos,
              "grupos": grupos,
              "precios_b2c": precios_b2c,
              "precios_b2b": precios_b2b
          }

          import os
          os.makedirs("shared", exist_ok=True)
          with open("shared/catalogo.json", "w", encoding="utf-8") as f:
              json.dump(resultado, f, ensure_ascii=False, indent=2)

          # ── Catálogo reducido para el panel de pedidos ──
          # El catalogo.json completo pesa ~900 KB porque trae tags, imágenes
          # y campos que el panel no usa. Acá se arma una versión con lo justo
          # para buscar y calcular (~100 KB), así el buscador es instantáneo.
          grupos_x_id = {str(g.get("Id_Grupo")): g for g in grupos}
          prod_x_id = {}
          for r in productos:
              pid = str(r.get("Id") or "")
              if pid and pid not in prod_x_id:
                  prod_x_id[pid] = r

          # ── Precios ──
          # Las dos tablas de la hoja tienen ahora las mismas columnas:
          #   Precio_Venta            precio de lista, una unidad
          #   Uni Dto                 desde cuántas unidades aplica el descuento
          #   Precio_Mayorista        precio unitario al comprar esa cantidad
          #   promo                   % de descuento temporal, vacío = sin promo
          #   Precio_Promo            Precio_Venta con la promo, redondeado a 50
          #   Precio_Promo_Mayorista  Precio_Mayorista con la promo
          #
          # La promo se traslada a los DOS precios a propósito: si solo bajara
          # el unitario, en varios productos saldría más barato comprar de a
          # una que por cantidad.
          def limpio(fila, clave):
              return (fila.get(clave) or "").strip()

          def catalogo_panel(precios, col_activo):
              filas = []
              for pr in precios:
                  pid = str(pr.get("Id") or "")
                  base = prod_x_id.get(pid)
                  if not base:
                      continue
                  if base.get("Activo") != "ON" or base.get(col_activo) != "ON":
                      continue
                  g = grupos_x_id.get(str(base.get("Id_Grupo")), {})

                  lista     = limpio(pr, "Precio_Venta")
                  por_cant  = limpio(pr, "Precio_Mayorista")
                  # Si no hay promo cargada, el precio con promo es el de lista:
                  # así el resto del sistema no necesita preguntar si hay campaña.
                  promo     = limpio(pr, "Precio_Promo") or lista
                  promo_cant = limpio(pr, "Precio_Promo_Mayorista") or por_cant

                  filas.append({
                      "id": pid,
                      "n":  (pr.get("Producto") or "").strip(),
                      "m":  (base.get("Marca") or "").strip(),
                      "c":  (g.get("Categoria") or base.get("Categoria") or "").strip(),
                      "co": limpio(pr, "Precio_Costo"),
                      "pv": lista,
                      "pp": promo,
                      "ud": limpio(pr, "Uni Dto"),
                      "pd": por_cant,
                      "ppd": promo_cant,
                      # Porcentaje tal como está en la hoja ("10%"): sirve para
                      # mostrar la etiqueta sin recalcularlo.
                      "pct": limpio(pr, "promo"),
                  })
              return sorted(filas, key=lambda x: x["n"])

          panel = {
              "b2c": catalogo_panel(precios_b2c, "Cat B2C"),
              "b2b": catalogo_panel(precios_b2b, "Cat B2B"),
          }
          os.makedirs("admin", exist_ok=True)
          with open("admin/productos.json", "w", encoding="utf-8") as f:
              json.dump(panel, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Panel: {len(panel['b2c'])} productos B2C, {len(panel['b2b'])} B2B")

          # Chequeo de integridad: si el cruce productos ↔ precios se rompe,
          # el build tiene que fallar en vez de publicar un catálogo sin precios.
          ids_precio = {p.get("Id") for p in precios_b2c}
          activos = [p for p in productos if p.get("Activo") == "ON" and p.get("Cat B2C") == "ON"]
          sin_precio = [p for p in activos if p.get("Id") not in ids_precio]
          if activos and len(sin_precio) > len(activos) * 0.5:
              raise SystemExit(
                  f"ERROR: {len(sin_precio)}/{len(activos)} productos activos sin precio. "
                  "Revisá los encabezados de las hojas Productos y Precios."
              )

          print(f"OK — {len(productos)} productos, {len(grupos)} grupos, "
                f"{len(precios_b2c)} precios B2C, {len(precios_b2b)} precios B2B, "
                f"{len(sin_precio)} activos sin precio")
          EOF

      - name: Commitear JSON actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared/catalogo.json admin/productos.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "chore: actualizar catálogo $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
