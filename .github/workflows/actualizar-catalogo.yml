name: Actualizar Catálogo

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:           # también permite correrlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Descargar CSVs y generar JSON
        run: |
          python3 - <<'EOF'
          import urllib.request, csv, json, io

          URL_PRODUCTOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj27LolH-UVxxXUBSF2JWHe1E6ZaIESYYa0QLrICgveXHh3ZXXrZBSX7X8DzLMFtws8wF1N-a-qVil/pub?gid=1666631008&single=true&output=csv"
          URL_GRUPOS    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj27LolH-UVxxXUBSF2JWHe1E6ZaIESYYa0QLrICgveXHh3ZXXrZBSX7X8DzLMFtws8wF1N-a-qVil/pub?gid=2138230487&single=true&output=csv"
          URL_PRECIOS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj27LolH-UVxxXUBSF2JWHe1E6ZaIESYYa0QLrICgveXHh3ZXXrZBSX7X8DzLMFtws8wF1N-a-qVil/pub?gid=955304075&single=true&output=csv"

          def leer_texto(url):
              with urllib.request.urlopen(url) as r:
                  return r.read().decode('utf-8')

          # La primera columna de las hojas es el Id, pero su encabezado a
          # veces viene con otro nombre (por ejemplo "f"). Si no se normaliza,
          # el cruce productos ↔ precios falla y la web queda sin precios.
          ALIAS_ID = ("Id", "f", "ID", "id")

          def normalizar_id(fila):
              if fila.get("Id"):
                  return fila
              for alias in ALIAS_ID:
                  if fila.get(alias):
                      fila["Id"] = fila[alias]
                      break
              return fila

          def leer_csv(url):
              content = leer_texto(url)
              reader = csv.DictReader(io.StringIO(content))
              return [normalizar_id(row) for row in reader]

          def leer_precios(url):
              """
              La hoja Precios tiene DOS tablas lado a lado en el mismo CSV:
              columnas 0-11  → Precios B2C (12 columnas, incluye Strat)
              columna  12    → separador vacío
              columnas 13-24 → Precios B2B (12 columnas, incluye Strat)
              No se puede usar DictReader directo porque los headers se repiten.
              """
              content = leer_texto(url)
              filas = list(csv.reader(io.StringIO(content)))
              header = filas[0]
              cols_b2c = header[0:12]
              cols_b2b = header[13:25]

              precios_b2c, precios_b2b = [], []
              for fila in filas[1:]:
                  if len(fila) < 25:
                      continue
                  izq = fila[0:12]
                  der = fila[13:25]
                  if izq[0]:  # tiene Id
                      precios_b2c.append(normalizar_id(dict(zip(cols_b2c, izq))))
                  if der[0]:
                      precios_b2b.append(normalizar_id(dict(zip(cols_b2b, der))))
              return precios_b2c, precios_b2b

          productos = leer_csv(URL_PRODUCTOS)
          grupos    = leer_csv(URL_GRUPOS)
          precios_b2c, precios_b2b = leer_precios(URL_PRECIOS)

          resultado = {
              "productos": productos,
              "grupos": grupos,
              "precios_b2c": precios_b2c,
              "precios_b2b": precios_b2b
          }

          import os
          os.makedirs("shared", exist_ok=True)
          with open("shared/catalogo.json", "w", encoding="utf-8") as f:
              json.dump(resultado, f, ensure_ascii=False, indent=2)

          # Chequeo de integridad: si el cruce productos ↔ precios se rompe,
          # el build tiene que fallar en vez de publicar un catálogo sin precios.
          ids_precio = {p.get("Id") for p in precios_b2c}
          activos = [p for p in productos if p.get("Activo") == "ON" and p.get("Cat B2C") == "ON"]
          sin_precio = [p for p in activos if p.get("Id") not in ids_precio]
          if activos and len(sin_precio) > len(activos) * 0.5:
              raise SystemExit(
                  f"ERROR: {len(sin_precio)}/{len(activos)} productos activos sin precio. "
                  "Revisá los encabezados de las hojas Productos y Precios."
              )

          print(f"OK — {len(productos)} productos, {len(grupos)} grupos, "
                f"{len(precios_b2c)} precios B2C, {len(precios_b2b)} precios B2B, "
                f"{len(sin_precio)} activos sin precio")
          EOF

      - name: Commitear JSON actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared/catalogo.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "chore: actualizar catálogo $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
